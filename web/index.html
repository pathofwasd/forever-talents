<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c141c" />
    <meta
      name="description"
      content="Forever Talents: an offline talent planner, skill atlas and branching build library for WoW Forever."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Forever Talents • talent planner</title>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <img src="./icon.svg" width="64" height="64" alt="" />
        <h1>Forever Talents</h1>
        <p>Loading the shared calculator…</p>
      </div>
    </div>
    <dialog id="modal"></dialog>
    <dialog id="talent-sheet" aria-labelledby="talent-sheet-title"></dialog>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
